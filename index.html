<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen p-4">
  <div id="app" class="max-w-4xl mx-auto"></div>

    let activeTab = 'office';

    const content = {

        { task: "Analyze adoption data", desc: "Review usage reports, identify trends, flag issues" },
        { task: "Coordinate with team", desc: "Sync on upcoming sessions, share feedback" },
        { task: "Update documentation", desc: "Maintain FAQ docs, use case libraries, success stories" },
        { task: "Support client reporting", desc: "Help prepare progress reports and presentations" },

        { task: "تحديث التوثيق", desc: "صيانة وثائق الأسئلة الشائعة، مكتبات حالات الاستخدام، قصص النجاح" },
        { task: "دعم تقارير العميل", desc: "المساعدة في إعداد تقارير التقدم والعروض" },
        { task: "الجدولة واللوجستيات", desc: "تنسيق جلسات التدريب، الحجوزات، الدعوات" }
      ]
    };

    const fieldWork = {
      en: [
        { task: "Deliver training sessions", desc: "Run hands-on Copilot workshops on-site", icon: "🎯" },
        { task: "User support", desc: "Help users directly with questions and issues", icon: "🤝" },
        { task: "Collect feedback", desc: "Talk to real users, understand their needs", icon: "📋" },
        { task: "Identify champions", desc: "Spot enthusiastic users who can help others", icon: "⭐" },
        { task: "Stakeholder meetings", desc: "Brief managers on progress, address concerns", icon: "👔" },
        { task: "Troubleshoot issues", desc: "Work with IT to resolve access or technical problems", icon: "🔧" }

      ar: [

    const skills = {

        { skill: "Data & Reporting", desc: "Comfortable with data analysis and creating reports", icon: "📊", proof: "Experience with data extraction, Excel pipelines, structured outputs" },

      ar: [

      ]
    };

    function render() {
      const t = content[lang];
      const isAr = lang === 'ar';
      
      let tabContent = '';
      
      if (activeTab === 'office') {
        tabContent = `
          <div class="flex items-center gap-2 mb-4">
            <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
            <h3 class="text-white font-semibold">${t.officeTitle}</h3>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${officeWork[lang].map(item => `
              <div class="bg-slate-700/30 rounded-xl p-4 border border-slate-600/30">
                <h4 class="text-white font-medium text-sm mb-1">${item.task}</h4>
                <p class="text-slate-400 text-xs">${item.desc}</p>
              </div>
            `).join('')}
          </div>
          <div class="mt-4 p-3 bg-blue-500/10 rounded-lg border border-blue-500/20">
            <p class="text-blue-300 text-xs">💻 ${t.officeNote}</p>
          </div>
        `;
      } else if (activeTab === 'field') {
        tabContent = `
          <div class="flex items-center gap-2 mb-4">
            <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <h3 class="text-white font-semibold">${t.fieldTitle}</h3>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${fieldWork[lang].map(item => `
              <div class="bg-slate-700/30 rounded-xl p-4 border border-slate-600/30">
                <div class="flex items-start gap-3">
                  <span class="text-xl">${item.icon}</span>
                  <div>
                    <h4 class="text-white font-medium text-sm mb-1">${item.task}</h4>
                    <p class="text-slate-400 text-xs">${item.desc}</p>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
          <div class="mt-4 p-3 bg-amber-500/10 rounded-lg border border-amber-500/20">
            <p class="text-amber-300 text-xs">👤 ${t.fieldNote}</p>
          </div>
        `;
      } else if (activeTab === 'skills') {
        tabContent = `
          <div class="flex items-center gap-2 mb-4">
            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            <h3 class="text-white font-semibold">${t.skillsTitle}</h3>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${skills[lang].map(item => `
              <div class="bg-slate-700/30 rounded-xl p-4 border border-slate-600/30">
                <div class="flex items-start gap-3">
                  <span class="text-xl">${item.icon}</span>
                  <div>
                    <h4 class="text-white font-medium text-sm">${item.skill}</h4>
                    <p class="text-slate-400 text-xs mt-1">${item.desc}</p>
                    <p class="text-emerald-400 text-xs mt-2 italic">${item.proof}</p>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      document.getElementById('app').innerHTML = `
        <div class="${isAr ? 'rtl' : 'ltr'}">
          <div class="flex justify-between items-start mb-6">
            <div>
              <h1 class="text-2xl font-bold text-white mb-1">${t.title}</h1>
              <p class="text-slate-400 text-sm">${t.subtitle}</p>
              <p class="text-emerald-400 text-sm mt-1">${t.preparedBy}</p>
            </div>
            <button onclick="toggleLang()" class="px-3 py-1.5 bg-slate-700 rounded-lg text-sm font-medium text-white hover:bg-slate-600 transition-colors">
              ${t.langToggle}
            </button>
          </div>

          <div class="flex gap-2 mb-4 flex-wrap">
            <button onclick="setTab('office')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'office' ? 'bg-white text-slate-900' : 'bg-slate-700/50 text-slate-300 hover:bg-slate-700'}">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
              ${t.tabs.office}
            </button>
            <button onclick="setTab('field')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'field' ? 'bg-white text-slate-900' : 'bg-slate-700/50 text-slate-300 hover:bg-slate-700'}">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              ${t.tabs.field}
            </button>
            <button onclick="setTab('skills')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${activeTab === 'skills' ? 'bg-white text-slate-900' : 'bg-slate-700/50 text-slate-300 hover:bg-slate-700'}">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>

          <div class="bg-slate-800/50 rounded-2xl border border-slate-700/50 p-5">

          </div>
        </div>
      `;
    }

    function toggleLang() {
      lang = lang === 'en' ? 'ar' : 'en';
      render();
    }

    function setTab(tab) {
      activeTab = tab;
      render();
    }

    render();
  </script>
</body>
</html>
